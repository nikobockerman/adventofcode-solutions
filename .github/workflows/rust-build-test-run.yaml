name: Rust build, test and run
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate runner
        uses: ./.github/actions/validate-runner

      - name: Setup tools through mise
        uses: ./.github/actions/mise-project-setup
        with:
          directory: .

      - id: matrix
        name: Generate build matrix
        run: |
          matrix=$(python3 .github/scripts/generate-rust-ci-config.py matrix)
          echo "matrix:"
          echo "${matrix}" | jq
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
        shell: bash

  build-test-run:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    name: ${{ matrix.runId }} - Build + test + run
    needs: matrix
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: solvers/rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate runner
        uses: ./.github/actions/validate-runner

      - name: Setup tools through mise
        uses: ./.github/actions/mise-project-setup
        with:
          directory: solvers/rust

      - name: Setup rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: bash -c "cd ${{ github.workspace }}/solvers/rust && {0}"
          key: ${{ matrix.profile }}
          workspaces: solvers/rust

      - name: Fetch dependencies
        run: cargo fetch --verbose --locked

      - name: Build

        env:
          PROFILE: ${{ matrix.profile }}
        run: cargo build --verbose --frozen --all-targets --profile "${PROFILE}"
        shell: bash

      - if: matrix.test
        name: Test

        env:
          PROFILE: ${{ matrix.profile }}
        run: cargo test --verbose --frozen --all-targets --profile "${PROFILE}"
        shell: bash

      - name: Check

        env:
          PROFILE: ${{ matrix.profile }}
        run: cargo check --verbose --frozen --all-targets --profile "${PROFILE}"
        shell: bash

      - if: matrix.clippy
        name: Clippy

        env:
          PROFILE: ${{ matrix.profile }}
        run: cargo clippy --verbose --frozen --all-targets --profile "${PROFILE}" -- -D warnings
        shell: bash

      - if: matrix.run
        name: Restore aoc-main project
        uses: ./.github/actions/uv-project-setup
        with:
          directory: aoc-main

      - if: matrix.run
        name: Extract inputs
        uses: ./.github/actions/extract-inputs
        with:
          encryption-key: ${{ secrets.INPUTS_ENCRYPTION_KEY }}

      - if: matrix.run
        name: Run all solutions
        env:
          AOC_RUST_BUILD_ARGS: --verbose --frozen --profile ${{ matrix.profile }}
        run: mise run aoc:all -- --solver rust
        shell: bash
        working-directory: .
