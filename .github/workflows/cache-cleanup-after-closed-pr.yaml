name: Cleanup GitHub runner caches on closed pull requests
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number"
        required: true
permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cleanup caches
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate runner
        uses: ./.github/actions/validate-runner

      - id: resolve

        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pull_request_number }}
        run: |
          # Resolve PR number
          prNumber="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER}}"
          if [[ -z "${prNumber}" ]]; then
            echo "::error::Pull request number not provided"
            exit 1
          fi

          echo "::group::Outputs"
          {
            echo "pr_number=${prNumber}"
          } | tee -a "${GITHUB_OUTPUT}"
        shell: bash

      - name: Restore mise tools
        uses: ./.github/actions/mise-project-setup
        with:
          directory: .

      - name: Cleanup caches

        env:
          GH_TOKEN: ${{ github.token }}
          MISE_TASK: "github:cache:remove-for-pr"
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: mise run "${MISE_TASK}"
        shell: bash
