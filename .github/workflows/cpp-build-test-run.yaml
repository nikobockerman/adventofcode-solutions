name: C++ build, test and run
on:
  workflow_call:
    inputs:
      homebrew-downloads-hash-from-prepare-macos:
        description: Hash of cached Homebrew downloads on MacOS
        required: true
        type: string
      homebrew-downloads-hash-from-prepare-ubuntu:
        description: Hash of cached Homebrew downloads on Ubuntu
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-test-run:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu
        compiler:
          - clang
          - gcc
        cxxLib:
          - libc++
          - libstdc++
        buildType:
          - debug
          - release
        exclude:
          - compiler: gcc
            cxxLib: libc++
        include:
          - os: ubuntu
            homebrew-downloads-hash-from-prepare: ${{ inputs.homebrew-downloads-hash-from-prepare-ubuntu }}
            runsOn: ubuntu-24.04

          - os: ubuntu
            compiler: clang
            cxxLib: libc++
            buildType: sanitizers
            homebrew-downloads-hash-from-prepare: ${{ inputs.homebrew-downloads-hash-from-prepare-ubuntu }}
            runsOn: ubuntu-24.04

          - os: ubuntu
            compiler: clang
            cxxLib: libc++
            buildType: hardened
            homebrew-downloads-hash-from-prepare: ${{ inputs.homebrew-downloads-hash-from-prepare-ubuntu }}
            runsOn: ubuntu-24.04

          - os: macos
            compiler: clang
            cxxLib: libstdc++
            buildType: release
            homebrew-downloads-hash-from-prepare: ${{ inputs.homebrew-downloads-hash-from-prepare-macos }}
            runsOn: macos-15

    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.cxxLib }} ${{ matrix.buildType }} - Build + test + run
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 30

    steps:
      - id: preset-name
        name: Define workflow preset name

        env:
          MATRIX_BUILDTYPE: ${{ matrix.buildType }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_CXXLIB: ${{ matrix.cxxLib }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          name="ci-${MATRIX_OS}-${MATRIX_COMPILER}-${MATRIX_CXXLIB}-${MATRIX_BUILDTYPE}"
          echo "name=${name}" | tee -a "${GITHUB_OUTPUT}"
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup homebrew packages
        uses: ./.github/actions/homebrew-packages-setup
        with:
          cache-mode: use
          downloads-hash-from-prepare: ${{ matrix.homebrew-downloads-hash-from-prepare }}

      - name: Setup tools through mise
        uses: ./.github/actions/mise-project-setup
        with:
          directory: solvers/cpp

      - id: setup-cmake-project
        name: Setup CMake project
        uses: ./.github/actions/cmake-project-setup
        with:
          conan-cache-key-prefix: conan-${{ steps.preset-name.outputs.name }}

      - if: matrix.os == 'ubuntu'
        name: Specify HOMEBREW_PREFIX
        run: |
          brewPrefix=$(brew --prefix)
          echo "HOMEBREW_PREFIX=${brewPrefix}" | tr -d '\n' >> "${GITHUB_ENV}"
        shell: bash

      - if: matrix.os == 'ubuntu' && matrix.compiler == 'gcc'
        name: Add brew binutils to path
        run: |
          echo "${HOMEBREW_PREFIX}/opt/binutils/bin" >> "${GITHUB_PATH}"
        shell: bash

      - id: setup-hardened-libcxx
        if: matrix.cxxLib == 'libc++' && matrix.buildType == 'hardened'
        name: Setup hardened libc++
        uses: ./.github/actions/hardened-libc++
        with:
          llvm-major-version: ${{ env.LLVM_MAJOR_VERSION }}

      - if: matrix.cxxLib == 'libc++' && matrix.buildType == 'hardened'
        name: Set env to hardened libc++ install dir for CMake and Conan configs

        env:
          HARDENED_LIBCXX_DIR: ${{ steps.setup-hardened-libcxx.outputs.install-dir }}
        run: |
          echo "HARDENED_LIBCXX_DIR=${HARDENED_LIBCXX_DIR}" | tr -d '\n' >> "${GITHUB_ENV}"
        shell: bash

      - if: matrix.buildType == 'sanitizers'
        name: Add LLVM to path for sanitizers
        run: echo "${HOMEBREW_PREFIX}/opt/llvm/bin" | tee -a "${GITHUB_PATH}"
        shell: bash

      - name: Generate C++ CI configuration
        env:
          MATRIX_BUILDTYPE: ${{ matrix.buildType }}
          MATRIX_COMPILER: ${{ matrix.compiler }}
          MATRIX_CXXLIB: ${{ matrix.cxxLib }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          python3 .github/scripts/generate-cpp-ci-config.py \
            --os "${MATRIX_OS}" \
            --compiler "${MATRIX_COMPILER}" \
            --cxx-lib "${MATRIX_CXXLIB}" \
            --build-type "${MATRIX_BUILDTYPE}"

          echo "::group::Generated solvers/cpp/CMakeUserPresets.json"
          cat solvers/cpp/CMakeUserPresets.json
          echo "::endgroup::"

          echo "::group::Generated solvers/cpp/ci.env"
          cat solvers/cpp/ci.env
          echo "::endgroup::"

          echo "::group::Generated solvers/cpp/conan-profile-ci"
          cat solvers/cpp/conan-profile-ci
          echo "::endgroup::"
        shell: bash

      - name: Configure CMake
        working-directory: solvers/cpp
        run: cmake --preset ci
        shell: bash

      - name: Build CMake project
        working-directory: solvers/cpp
        run: cmake --build build/
        shell: bash

      - name: Test CMake project
        working-directory: solvers/cpp
        run: |
          # shellcheck source=/dev/null
          source ci.env
          ctest --test-dir build/ --output-on-failure
        shell: bash

      - name: Verify runtime C++ standard library
        env:
          MATRIX_BUILDTYPE: ${{ matrix.buildType }}
          MATRIX_CXXLIB: ${{ matrix.cxxLib }}
        run: |
          case "${MATRIX_CXXLIB}" in
            libstdc++)
              stdlib=libstdc++
              expectedPrefix="${HOMEBREW_PREFIX}/opt/gcc@${GCC_MAJOR_VERSION}"
              ;;
            libc++)
              stdlib=libc++
              if [[ "${MATRIX_BUILDTYPE}" == "hardened" ]]; then
                expectedPrefix="${HARDENED_LIBCXX_DIR}"
              else
                expectedPrefix="${HOMEBREW_PREFIX}/opt/llvm@${LLVM_MAJOR_VERSION}"
              fi
              ;;
            *)
              echo "::error::Unknown cxxLib: ${MATRIX_CXXLIB}"
              exit 1
              ;;
          esac
          mise run cpp:verify-runtime-stdlib -- solvers/cpp/build "${stdlib}" "${expectedPrefix}"
        shell: bash

      - name: Restore aoc-main uv project
        uses: ./.github/actions/uv-project-setup
        with:
          directory: aoc-main

      - name: Extract inputs
        uses: ./.github/actions/extract-inputs
        with:
          encryption-key: ${{ secrets.INPUTS_ENCRYPTION_KEY }}

      - name: Run all solutions
        env:
          AOC_CPP_SKIP_PREPARE: "1"
          AOC_CPP_PRESET: ci
        run: |
          # shellcheck source=/dev/null
          source solvers/cpp/ci.env
          mise run aoc:all -- --solver cpp
        shell: bash

      - continue-on-error: true
        if: always()
        name: sccache stats
        run: sccache --show-stats
        shell: bash

      - name: Finalize cmake project
        uses: ./.github/actions/cmake-project-finalize
        with:
          conan-cache-key-prefix: conan-${{ steps.preset-name.outputs.name }}
          conan-cache-matched-key: ${{ steps.setup-cmake-project.outputs.conan-cache-matched-key }}
