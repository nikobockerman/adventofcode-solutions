name: CI - Solvers - Rust
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Checks
  build-test-run:
    uses: ./.github/workflows/rust-build-test-run.yaml
    secrets: inherit

  check-rustfmt:
    uses: ./.github/workflows/mise-task.yaml
    with:
      directory: solvers/rust
      task: check:rustfmt

  # Check for all green CI for Rust
  check:
    if: always()
    needs:
      - build-test-run
      - check-rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
