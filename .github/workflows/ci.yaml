name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Run every Monday at 00:30 UTC
    - cron: "30 0 * * 1"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  # For pull requests, use PR identifier as group. For main branch, use unique identifier.
  # -> PRs cancel in progress runs. Main executions run concurrently.
  group: ${{ github.workflow }}-${{ github.ref_name == 'main' && github.run_id || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Mise cache prepare
  mise-cache-macos:
    uses: ./.github/workflows/mise-prepare-cache.yaml
    with:
      runner: macos-15

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-mise-root-macos

  mise-cache-ubuntu:
    uses: ./.github/workflows/mise-prepare-cache.yaml
    with:
      runner: ubuntu-24.04

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-mise-root-ubuntu

  # uv cache prepare
  uv-cache-aoc-main-macos:
    needs: mise-cache-macos
    uses: ./.github/workflows/mise-uv-prepare-cache.yaml
    with:
      directory: aoc-main
      runner: macos-15

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-uv-aoc-main-macos

  uv-cache-aoc-main-ubuntu:
    needs: mise-cache-ubuntu
    uses: ./.github/workflows/mise-uv-prepare-cache.yaml
    with:
      directory: aoc-main
      runner: ubuntu-24.04

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-uv-aoc-main-ubuntu

  uv-cache-solvers-python-ubuntu:
    needs: mise-cache-ubuntu
    uses: ./.github/workflows/mise-uv-prepare-cache.yaml
    with:
      directory: solvers/python
      runner: ubuntu-24.04

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-uv-solvers-python-ubuntu

  # Homebrew cache prepare
  homebrew-cache-macos:
    uses: ./.github/workflows/homebrew-prepare-cache.yaml
    with:
      runner: macos-15

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-homebrew-macos

  homebrew-cache-ubuntu:
    uses: ./.github/workflows/homebrew-prepare-cache.yaml
    with:
      runner: ubuntu-24.04

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-homebrew-ubuntu

  # Checks
  checks-mise:
    needs: mise-cache-ubuntu
    uses: ./.github/workflows/checks-mise.yaml

  checks-python:
    needs:
      - mise-cache-ubuntu
      - uv-cache-solvers-python-ubuntu
    uses: ./.github/workflows/checks-python.yaml

  # Run the solvers
  solvers-cpp:
    needs:
      - homebrew-cache-macos
      - homebrew-cache-ubuntu
      - mise-cache-macos
      - mise-cache-ubuntu
      - uv-cache-aoc-main-macos
      - uv-cache-aoc-main-ubuntu
    uses: ./.github/workflows/cpp-build-test-run.yaml
    secrets: inherit
    with:
      homebrew-downloads-hash-from-prepare-macos: ${{ needs.homebrew-cache-macos.outputs.downloads-hash }}
      homebrew-downloads-hash-from-prepare-ubuntu: ${{ needs.homebrew-cache-ubuntu.outputs.downloads-hash }}

  solvers-python:
    needs:
      - mise-cache-ubuntu
      - uv-cache-solvers-python-ubuntu
    uses: ./.github/workflows/python-run.yaml
    secrets: inherit

  solvers-rust:
    needs:
      - mise-cache-macos
      - mise-cache-ubuntu
      - uv-cache-aoc-main-macos
      - uv-cache-aoc-main-ubuntu
    uses: ./.github/workflows/rust-build-test-run.yaml
    secrets: inherit

  # Check for all green CI
  check:
    if: always()
    needs:
      - checks-mise
      - checks-python
      - solvers-cpp
      - solvers-python
      - solvers-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
